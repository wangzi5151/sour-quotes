<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="lemon" x1="0.2" y1="0.05" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ffe259"/>
      <stop offset="1" stop-color="#ffa751"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.35" cy="0.25" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafL" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2fb884"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <g transform="translate(256 256) scale(0.62) translate(-256 -256)">
    <!-- 柠檬主体 -->
    <ellipse cx="256" cy="308" rx="148" ry="138" fill="url(#lemon)"/>
    <ellipse cx="256" cy="308" rx="148" ry="138" fill="url(#shine)"/>

    <!-- 头部叶子 -->
    <g transform="translate(256 168)">
      <path d="M0,-4 C -18,-28 -42,-34 -52,-16 C -62,2 -44,18 -20,12 C -6,8 0,2 0,-4 Z" fill="url(#leafL)"/>
      <path d="M0,-4 C 18,-28 42,-34 52,-16 C 62,2 44,18 20,12 C 6,8 0,2 0,-4 Z" fill="#2fb884"/>
      <path d="M0,-4 L0,-20" stroke="#f0ab4a" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- 眼睛 -->
    <ellipse cx="204" cy="292" rx="26" ry="28" fill="#3a2410"/>
    <ellipse cx="308" cy="292" rx="26" ry="28" fill="#3a2410"/>
    <ellipse cx="212" cy="284" rx="9" ry="10" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="316" cy="284" rx="9" ry="10" fill="#ffffff" opacity="0.9"/>

    <path d="M178 268 Q192 260 204 266" stroke="#2b1506" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M308 266 Q320 260 334 268" stroke="#2b1506" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- 嘴 -->
    <path d="M228 356 Q256 334 284 356" stroke="#2b1506" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M284 356 Q300 362 308 352" stroke="#2b1506" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- 腮红 -->
    <ellipse cx="172" cy="330" rx="18" ry="12" fill="#ff7eb6" opacity="0.5"/>
    <ellipse cx="340" cy="330" rx="18" ry="12" fill="#ff7eb6" opacity="0.5"/>

    <!-- 毒液滴 -->
    <path d="M256 128 Q256 148 256 148 C 244 148 244 158 256 158 C 268 158 268 148 256 148" fill="#7cff6b" opacity="0.95"/>
    <circle cx="256" cy="186" r="12" fill="#7cff6b" opacity="0.9"/>
  </g>
</svg>
