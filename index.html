<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <meta name="description" content="每日毒鸡汤：每天一句扎心语录，笑着活下去。一键复制分享。" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>每日毒鸡汤</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-emoji">🍋</span>
        <h1>每日毒鸡汤</h1>
        <span class="brand-badge">v1.0</span>
      </div>
    </header>

    <main class="stage">
      <section class="quote-card" id="quoteCard">
        <div class="card-glow"></div>
        <div class="card-cat" id="cardCat"></div>
        <blockquote class="quote-text" id="quoteText">加载中…</blockquote>
        <div class="quote-tag" id="quoteTag"></div>
      </section>

      <section class="controls">
        <button class="btn btn-primary" id="btnDaily">
          <span class="btn-icon">📅</span>今日毒鸡汤
        </button>
        <button class="btn btn-ghost" id="btnRandom">
          <span class="btn-icon">🎲</span>再来一碗
        </button>
      </section>

      <section class="actions">
        <button class="act" id="actCopy"><span class="act-icon">📋</span>复制</button>
        <button class="act" id="actFav"><span class="act-icon" id="favIcon">🤍</span>收藏</button>
        <button class="act" id="actShare"><span class="act-icon">🚀</span>分享</button>
        <button class="act" id="actPrev"><span class="act-icon">⏮️</span>上一条</button>
      </section>

      <section class="cats" id="catFilter">
        <span class="cat active" data-cat="all">全部</span>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="quote"><span>🍋</span>今日</button>
      <button class="nav-item" data-tab="favorites"><span>⭐</span>收藏</button>
      <button class="nav-item" data-tab="about"><span>ℹ️</span>关于</button>
    </nav>

    <section id="tabFavorites" class="tab-page hidden"></section>
    <section id="tabAbout" class="tab-page hidden"></section>

    <div id="toast" class="toast hidden"></div>
  </div>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
